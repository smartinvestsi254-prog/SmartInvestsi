name: CI Pipeline

on:
  push:
    refactor/smartgovern-separation
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - '.devcontainer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # SmartInvestsi
  # ============================================
  smartinvestsi-validate:
    name: SmartInvestsi - Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit
      run: pre-commit run --all-files
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
  main

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
 refactor/smartgovern-separation
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
          node-version: ${{ matrix.node-version }}
  main

      - name: Install dependencies
        run: npm install

 refactor/smartgovern-separation
      - name: Prisma Generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/smartinvestsi' }}

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/smartinvestsi' }}

      - name: Test
        run: npm test

  # ============================================
  # SmartGovern
  # ============================================
  smartgovern-validate:
    name: SmartGovern - Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartGovern

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./SmartGovern/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.SMARTGOVERN_DATABASE_URL || 'postgresql://localhost:5432/smartgovern' }}

      - name: Type check
        run: npm run type-check
      - name: Check engine compatibility
        run: node -v && npm -v

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint (if exists)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check (TypeScript)
        run: npm run typecheck --if-present
        continue-on-error: true

      - name: Build project
        run: npm run build --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=high || true
 main

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.SMARTGOVERN_DATABASE_URL || 'postgresql://localhost:5432/smartgovern' }}
 refactor/smartgovern-separation
      - name: Test
        run: npm test
    - name: Scan for secrets
      run: detect-secrets scan --baseline .secrets.baseline || detect-secrets scan
      continue-on-error: true  # No .secrets.baseline exists yet
 main

  # ============================================
  # Deploy (main only, not on PRs)
  # ============================================
  deploy:
    name: Deploy
    needs: [smartinvestsi-validate, smartgovern-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
 refactor/smartgovern-separation

    steps:
      - uses: actions/checkout@v4

      - name: Deploy SmartInvestsi to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: .
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy SmartInvestsi from GitHub Actions"
          enable-commit-comment: true
          alias: smartinvestsi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_SMARTINVESTSI }}
        timeout-minutes: 5

      - name: Deploy SmartGovern to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./SmartGovern
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy SmartGovern from GitHub Actions"
          enable-commit-comment: true
          alias: smartgovern
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_SMARTGOVERN }}
        timeout-minutes: 5
    if: github.event_name == 'pull_request'
    needs: build
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Prisma generate
      run: npx prisma generate

    - name: Build for preview
      run: npm run build
      continue-on-error: true

    - name: Deploy to Netlify (Preview)
      uses: netlify/actions/cli@master
      with:
        args: deploy --dir=. --functions=netlify/functions
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
 main
