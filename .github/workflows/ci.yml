name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - '.devcontainer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Code Quality & Security Checks
  # ============================================
  pre-commit:
    name: Pre-Commit & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pre-commit & detect-secrets
        run: pip install pre-commit detect-secrets

      - name: Run pre-commit
        run: pre-commit run --all-files
        continue-on-error: true

      - name: Scan for secrets
        run: detect-secrets scan --baseline .secrets.baseline || detect-secrets scan
        continue-on-error: true

  # ============================================
  # SmartInvestsi Job
  # ============================================
  smartinvestsi-validate:
    name: SmartInvestsi - Validate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/smartinvestsi' }}

      - name: Type check
        run: npm run type-check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/smartinvestsi' }}

      - name: Test
        run: npm test --if-present

  # ============================================
  # SmartGovern Job
  # ============================================
  smartgovern-validate:
    name: SmartGovern - Validate & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SmartGovern

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./SmartGovern/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma Generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.SMARTGOVERN_DATABASE_URL || 'postgresql://localhost:5432/smartgovern' }}

      - name: Type check
        run: npm run type-check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.SMARTGOVERN_DATABASE_URL || 'postgresql://localhost:5432/smartgovern' }}

      - name: Test
        run: npm test --if-present

      - name: Security audit
        run: npm audit --audit-level=high || true

  # ============================================
  # Deploy (main branch only)
  # ============================================
  deploy:
    name: Production Deployment
    needs: [pre-commit, smartinvestsi-validate, smartgovern-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy SmartInvestsi to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: .
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy SmartInvestsi from GitHub Actions"
          enable-commit-comment: true
          alias: smartinvestsi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_SMARTINVESTSI }}
        timeout-minutes: 5

      - name: Deploy SmartGovern to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./SmartGovern
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy SmartGovern from GitHub Actions"
          enable-commit-comment: true
          alias: smartgovern
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_SMARTGOVERN }}
        timeout-minutes: 5
        
