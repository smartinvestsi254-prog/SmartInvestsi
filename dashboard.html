<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalization & Onboarding Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark py-4">

    <div class="container max-w-lg">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0 fw-bold">Personalization Setup</h5>
                    <span id="onboardingPill" class="badge rounded-pill" style="background: #e2e8f0; color: #1f2937;">Not personalized</span>
                </div>
                
                <p id="onboardingSummary" class="text-muted small mb-4">
                    Complete the plan to see personalized next steps.
                </p>

                <form id="onboardingForm">
                    <div class="mb-3">
                        <label for="riskTolerance" class="form-label small fw-semibold">Risk Tolerance</label>
                        <select id="riskTolerance" class="form-select form-select-sm">
                            <option value="LOW">Low (Conservative)</option>
                            <option value="MODERATE" selected>Moderate (Balanced)</option>
                            <option value="HIGH">High (Aggressive)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="investmentGoals" class="form-label small fw-semibold">Investment Goals</label>
                        <select id="investmentGoals" class="form-select form-select-sm">
                            <option value='["GROWTH"]' selected>Capital Growth</option>
                            <option value='["INCOME"]'>Passive Income</option>
                            <option value='["PRESERVATION"]'>Capital Preservation</option>
                        </select>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="cryptoPref">
                        <label class="form-check-label small" for="cryptoPref">Include Cryptocurrency Recommendations</label>
                    </div>

                    <div class="mb-4">
                        <label for="notificationFreq" class="form-label small fw-semibold">Notification Frequency</label>
                        <select id="notificationFreq" class="form-select form-select-sm">
                            <option value="daily">Daily</option>
                            <option value="weekly" selected>Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="btn btn-primary btn-sm px-3">Save & Personalize</button>
                        <button type="button" id="onboardingReset" class="btn btn-outline-secondary btn-sm">Reset</button>
                        <span id="onboardingStatus" class="badge bg-info text-dark ms-auto">Not started</span>
                    </div>
                </form>
            </div>
        </div>

        <!-- Dynamic Recommendations Section -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3">Recommended Next Steps</h6>
                <div id="onboardingActions" class="row g-3">
                    <!-- Dynamic action cards will render here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Embedded Vanilla JavaScript -->
    <script>
        // Utility to get or create a mock user ID
        async function getCurrentUserId() {
            let userId = localStorage.getItem('app_user_id');
            if (!userId) {
                userId = 'usr_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('app_user_id', userId);
            }
            return userId;
        }

        // Onboarding Form Handler
        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const riskToleranceEl = document.getElementById('riskTolerance');
            const investmentGoalsEl = document.getElementById('investmentGoals');
            const cryptoPrefEl = document.getElementById('cryptoPref');
            const notificationFreqEl = document.getElementById('notificationFreq');

            const data = {
                riskTolerance: riskToleranceEl ? riskToleranceEl.value : 'MODERATE',
                investmentGoals: JSON.parse((investmentGoalsEl ? investmentGoalsEl.value : '') || '[]'),
                preferences: {
                    crypto: cryptoPrefEl ? cryptoPrefEl.checked : false,
                    notification_freq: notificationFreqEl ? notificationFreqEl.value : 'weekly'
                }
            };

            try {
                const userId = await getCurrentUserId();
                
                // 1. Post user profile data
                const profileRes = await fetch('/.netlify/functions/personalization/profile', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'x-user-id': userId 
                    },
                    body: JSON.stringify(data)
                });

                if (!profileRes.ok) throw new Error('Failed to update profile');
                const profile = await profileRes.json();

                // 2. Update status & pill indicators
                const statusEl = document.getElementById('onboardingStatus');
                if (statusEl) {
                    statusEl.textContent = 'Saved';
                    statusEl.className = 'badge bg-success';
                }

                const summaryEl = document.getElementById('onboardingSummary');
                if (summaryEl) {
                    summaryEl.textContent = `Risk: ${data.riskTolerance} | Crypto: ${data.preferences.crypto ? 'Enabled' : 'Disabled'}`;
                }

                const pillEl = document.getElementById('onboardingPill');
                if (pillEl) {
                    pillEl.textContent = 'Personalized';
                    pillEl.style.background = '#d1fae5';
                    pillEl.style.color = '#065f46';
                }

                // 3. Fetch and render personalized recommendations
                const recsRes = await fetch('/.netlify/functions/personalization/recommendations', {
                    headers: { 'x-user-id': userId }
                });
                
                if (!recsRes.ok) throw new Error('Failed to fetch recommendations');
                const recs = await recsRes.json();
                
                const actionsContainer = document.getElementById('onboardingActions');
                if (actionsContainer && Array.isArray(recs.data)) {
                    actionsContainer.innerHTML = recs.data.map((rec) => `
                        <div class="col-md-6">
                            <div class="alert alert-info mb-0">
                                <h6 class="fw-bold mb-1">${rec.title || 'Recommended Action'}</h6>
                                <p class="small text-muted mb-2">${rec.description || ''}</p>
                                <div class="d-flex align-items-center justify-content-between">
                                    <a href="${rec.actionUrl || '#'}" class="btn btn-sm btn-primary">Take Action</a>
                                    ${rec.estimatedReturn ? `<span class="badge bg-success">${rec.estimatedReturn}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error saving onboarding data:', error);
                const statusEl = document.getElementById('onboardingStatus');
                if (statusEl) {
                    statusEl.textContent = 'Error';
                    statusEl.className = 'badge bg-danger';
                }
            }
        });

        // Reset Handler
        document.getElementById('onboardingReset')?.addEventListener('click', () => {
            const form = document.getElementById('onboardingForm');
            if (form) form.reset();
            
            const statusEl = document.getElementById('onboardingStatus');
            if (statusEl) {
                statusEl.textContent = 'Not started';
                statusEl.className = 'badge bg-info text-dark';
            }

            const actionsContainer = document.getElementById('onboardingActions');
            if (actionsContainer) actionsContainer.innerHTML = '';

            const summaryEl = document.getElementById('onboardingSummary');
            if (summaryEl) summaryEl.textContent = 'Complete the plan to see personalized next steps.';

            const pillEl = document.getElementById('onboardingPill');
            if (pillEl) {
                pillEl.textContent = 'Not personalized';
                pillEl.style.background = '#e2e8f0';
                pillEl.style.color = '#1f2937';
            }
        });
    </script>
</body>
</html>
