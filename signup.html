<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartInvestsi</title>
    <meta name="description" content="Create your SmartInvestsi account">
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://smartinvestsi.netlify.app/signup.html">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a365d'/%3E%3Cstop offset='100%25' style='stop-color:%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Cpath d='M30 55 L40 45 L50 60 L70 35' stroke='%23d4af37' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='70' cy='35' r='3' fill='%23d4af37'/%3E%3C/svg%3E">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a365d 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            margin: 0;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            padding: 2rem 2rem 1.5rem 2rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-svg {
            width: 48px;
            height: 48px;
            margin-bottom: 0.5rem;
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a365d;
            margin: 0;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }

        .form-control, .form-select {
            font-size: 0.9rem;
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-text {
            font-size: 0.75rem;
            color: #64748b;
        }

        .btn-primary {
            width: 100%;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #2563eb;
            border: none;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .form-check-label {
            font-size: 0.8rem;
            color: #475569;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.85rem;
            color: #64748b;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#d4af37"/>
                        <stop offset="100%" style="stop-color:#f4d03f"/>
                    </linearGradient>
                </defs>
                <path d="M30 55 L40 45 L50 60 L70 35" stroke="url(#logoGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="70" cy="35" r="6" fill="#d4af37"/>
            </svg>
            <h1 class="auth-title">SmartInvestsi</h1>
            <p class="auth-subtitle">Create your trading account</p>
        </div>

        <!-- Registration Form -->
        <form id="signupForm">
            <div class="mb-2.5 mb-2">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
            </div>

            <div class="mb-2">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>

            <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required minlength="8">
            </div>

            <div class="mb-2">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+27 11 123 4567" required>
            </div>

            <div class="mb-2">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                    <option value="" selected disabled>Select Country</option>
                    <option value="ZA">South Africa</option>
                    <option value="KE">Kenya</option>
                    <option value="NG">Nigeria</option>
                    <option value="GH">Ghana</option>
                    <option value="TZ">Tanzania</option>
                    <option value="UG">Uganda</option>
                    <option value="ZW">Zimbabwe</option>
                    <option value="BW">Botswana</option>
                    <option value="ZM">Zambia</option>
                    <option value="MZ">Mozambique</option>
                    <option value="NA">Namibia</option>
                    <option value="AO">Angola</option>
                    <option value="RW">Rwanda</option>
                    <option value="ET">Ethiopia</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label for="bankName" class="form-label">Bank Name</label>
                    <input type="text" class="form-control" id="bankName" placeholder="e.g. FNB, KCB" required>
                </div>
                <div class="col-6">
                    <label for="accountNumber" class="form-label">Account No.</label>
                    <input type="text" class="form-control" id="accountNumber" placeholder="Account No." required>
                </div>
            </div>

            <div class="form-check mb-3 mt-3">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                    I agree to the <a href="/terms.html" target="_blank">Terms</a> & <a href="/privacy.html" target="_blank">Privacy Policy</a>
                </label>
            </div>

            <!-- hCaptcha -->
            <div class="mb-3 d-flex justify-content-center">
                <div class="h-captcha" data-sitekey="YOUR_HCAPTCHA_SITEKEY"></div>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script src="/public/js/auth.js"></script>
    <script>
        // Redirect if already authenticated, unless requested to clear session or register new user
(async () => {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const forceSignup = urlParams.get('new') === 'true';

    if (!forceSignup && typeof getCurrentUser === 'function') {
      const user = await getCurrentUser();
      if (user) {
        // Logged-in users get sent to dashboard
        window.location.href = user.isAdmin ? '/admin.html' : '/dashboard.html';
      }
    }
  } catch (err) {
    console.error('Auth check error:', err);
  }
})();
        
        // Handle Form Submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const captchaToken = typeof hcaptcha !== 'undefined' ? hcaptcha.getResponse() : null;

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value,
                bankName: document.getElementById('bankName').value,
                accountNumber: document.getElementById('accountNumber').value,
                acceptTerms: document.getElementById('terms').checked,
                captchaToken: captchaToken
            };

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Signup failed');

                alert('Registration successful!');
                window.location.href = '/dashboard.html';
            } catch (err) {
                alert('Sign up failed: ' + err.message);
                if (typeof hcaptcha !== 'undefined') hcaptcha.reset();
            }
        });
    </script>
</body>
    </html>
