[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  port = 8888

# Removed invalid /.netlify/functions redirect (Netlify handles this automatically)

# SPA routing for index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Not = [{Query = {path = "*.html"}}] }
