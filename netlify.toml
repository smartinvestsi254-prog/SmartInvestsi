[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  port = 8888

# SPA routing for index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect www to non-www
[[redirects]]
  from = "https://www.smartinvestsi.netlify.app/*"
  to = "https://smartinvestsi.netlify.app/:splat"
  status = 301
  force = true

# Ads redirect
[[redirects]]
  from = "/ads"
  to = "/advertiser-dashboard.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' https: 'unsafe-inline' 'unsafe-eval' *.googlesyndication.com *.chatbase.co; img-src 'self' https: data:"

# Cache control for assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
