<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact SmartInvestsi - Get Support</title>
    <meta name="description" content="Contact SmartInvestsi for support, partnerships, or inquiries.">
    <meta name="google-adsense-account" content="ca-pub-8251495052020406">
    <meta name="robots" content="index,follow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/wwwroot/css/corporate-theme.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="display-4 text-center mb-5">Contact Us</h1>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Send Message</button>
                </form>
            </div>
            <div class="col-md-6">
                <div class="card p-4 bg-light">
                    <h5 class="mb-3">Get in Touch</h5>
                    <p><strong>Email:</strong> support@smartinvestsi.netlify.app</p>
                    <p><strong>Phone:</strong> +27-11-123-4567</p>
                    <p><strong>Address:</strong> Sandton City, Johannesburg, South Africa</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
