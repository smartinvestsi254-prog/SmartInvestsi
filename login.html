<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SmartInvestsi</title>
    <meta name="description" content="Sign in to your SmartInvestsi account">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://smartinvestsi.netlify.app/login.html">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231a365d'/%3E%3Cstop offset='100%25' style='stop-color:%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23g)'/%3E%3Cpath d='M30 55 L40 45 L50 60 L70 35' stroke='%23d4af37' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='70' cy='35' r='3' fill='%23d4af37'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/public/js/public-config.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a365d 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
        }
        .logo-container { text-align: center; margin-bottom: 2rem; }
        .logo-svg { width: 60px; height: 60px; margin-bottom: 1rem; }
        .auth-title { font-size: 1.75rem; font-weight: 700; color: #1a365d; margin-bottom: 0.5rem; }
        .auth-subtitle { color: #64748b; margin-bottom: 1.5rem; }
        .oauth-buttons { display: grid; gap: 0.75rem; margin-bottom: 2rem; }
        .btn-oauth {
            display: flex; align-items: center; justify-content: center; gap: 0.75rem;
            padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px;
            background: white; font-weight: 600; transition: all 0.2s; cursor: pointer;
        }
        .btn-oauth:hover { border-color: #2563eb; background: #f8fafc; }
        .btn-oauth svg { width: 20px; height: 20px; }
        .divider {
            display: flex; align-items: center; text-align: center; margin: 2rem 0;
            color: #94a3b8; font-size: 0.875rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider span { padding: 0 1rem; }
        .form-control { padding: 0.75rem; border-radius: 8px; border: 2px solid #e2e8f0; }
        .form-control:focus { border-color: #2563eb; box-shadow: none; }
        .password-wrapper { position: relative; }
        .password-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #94a3b8;
        }
        .btn-primary {
            width: 100%; padding: 0.75rem; border-radius: 8px; font-weight: 600;
            background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none;
        }
        #alertMessage { display: none; margin-bottom: 1rem; border-radius: 8px; }
        .login-fields { display: none; }
        .login-fields.active { display: block; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#d4af37"/>
                        <stop offset="100%" style="stop-color:#f4d03f"/>
                    </linearGradient>
                </defs>
                <path d="M30 55 L40 45 L50 60 L70 35" stroke="url(#logoGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="70" cy="35" r="6" fill="#d4af37"/>
            </svg>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your SmartInvestsi account</p>
        </div>

        <div id="alertMessage" class="alert alert-danger small" role="alert" style="display: none;"></div>

        <div class="mb-4 text-center">
            <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="loginMethod" id="emailMethod" checked>
                <label class="btn btn-outline-primary" for="emailMethod"><i class="fas fa-envelope"></i></label>
                <input type="radio" class="btn-check" name="loginMethod" id="phoneMethod">
                <label class="btn btn-outline-primary" for="phoneMethod"><i class="fas fa-phone"></i></label>
                <input type="radio" class="btn-check" name="loginMethod" id="idMethod">
                <label class="btn btn-outline-primary" for="idMethod"><i class="fas fa-id-card"></i></label>
            </div>
        </div>

        <div class="oauth-buttons">
            <button class="btn-oauth" onclick="signInWithGoogle()">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
        </div>

        <div class="divider"><span>Or use credentials</span></div>

        <div id="alertMessage" class="alert alert-danger small" role="alert" style="display: none;"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Email, Phone, or ID Number</label>
                <input type="text" class="form-control" id="identifier" placeholder="Enter email, phone, or ID number" required autocomplete="username">
                <small class="text-muted">You can sign in with any of these identifiers</small>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Password</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-dark" for="rememberMe">Remember me</label>
                </div>
                <a href="/forgot-password.html" class="small text-decoration-none text-primary fw-bold">Forgot password?</a>
            </div>

            <!-- hCaptcha -->
            <div class="mb-3">
                <div class="h-captcha" id="hcaptcha-widget" data-sitekey=""></div>
                <input type="hidden" id="hcaptchaToken" name="hcaptchaToken">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <div class="auth-footer">
            <p class="small mb-0">No account? <a href="/signup.html" class="fw-bold">Sign up</a></p>
            <p class="mt-3 x-small text-muted" style="font-size: 10px;">🛡️ GDPR & Kenya DPA Compliant</p>
        </div>
    </div>

    <script>
        // 1. INITIALIZE SUPABASE (uses PUBLIC_CONFIG from /public/js/public-config.js)
        const SUPABASE_URL = window.PUBLIC_CONFIG.supabaseUrl;
        const SUPABASE_ANON_KEY = window.PUBLIC_CONFIG.supabaseAnonKey;
        let supabase;
        
        // Robust Supabase initialization with error handling
        try {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
                throw new Error('Supabase configuration missing. Please check your environment variables.');
            }
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error('Failed to initialize Supabase:', err);
            alertMsg.innerHTML = '<strong>Configuration Error:</strong> Unable to connect to authentication service. Please try again later or contact support.';
            alertMsg.style.display = 'block';
        }

        // 2. UI HANDLERS
        const loginForm = document.getElementById('loginForm');
        const alertMsg = document.getElementById('alertMessage');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const identifierInput = document.getElementById('identifier');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const hcaptchaToken = document.getElementById('hcaptchaToken');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Detect identifier type (email, phone, or ID)
        function detectIdentifierType(value) {
            // Email detection
            if (value.includes('@')) return 'email';
            // Phone detection (international format)
            if (/^\+?[\d\s-]{10,}$/.test(value)) return 'phone';
            // ID number detection (8-10 digits)
            if (/^\d{8,10}$/.test(value)) return 'id';
            // Default to email if contains @, otherwise ID
            return value.includes('@') ? 'email' : 'id';
        }

        // 3. AUTHENTICATION LOGIC
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMsg.style.display = 'none';
            
            // Show loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Signing in...';
            btnSpinner.classList.remove('d-none');

            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;
            const hCaptchaResponse = hcaptchaToken.value;

            // Validation
            if (!identifier || !password) {
                alertMsg.innerHTML = '<strong>Error:</strong> Please fill in all required fields.';
                alertMsg.style.display = 'block';
                resetSubmitButton();
                return;
            }

            if (!hCaptchaResponse) {
                alertMsg.innerHTML = '<strong>Error:</strong> Please complete the CAPTCHA verification.';
                alertMsg.style.display = 'block';
                resetSubmitButton();
                return;
            }

            // Check network connectivity
            if (!navigator.onLine) {
                alertMsg.innerHTML = '<strong>Network Error:</strong> Please check your internet connection and try again.';
                alertMsg.style.display = 'block';
                resetSubmitButton();
                return;
            }

            try {
                const identifierType = detectIdentifierType(identifier);
                let userEmail = identifier;

                // If not email, lookup user by phone or ID
                if (identifierType !== 'email') {
                    try {
                        const { data, error } = await supabase
                            .from('profiles')
                            .select('email')
                            .eq(identifierType === 'phone' ? 'phone' : 'id_number', identifier)
                            .single();

                        if (error || !data) {
                            throw new Error('Account not found. Please check your ' + identifierType + ' and try again.');
                        }
                        userEmail = data.email;
                    } catch (lookupErr) {
                        console.error('Profile lookup error:', lookupErr);
                        throw new Error('Account not found. Please check your credentials and try again.');
                    }
                } else {
                    // Normalize email
                    userEmail = identifier.toLowerCase();
                }

                // Supabase Auth call with comprehensive error handling
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: userEmail,
                    password: password,
                });

                if (authError) {
                    console.error('Auth error:', authError);
                    // User-friendly error messages
                    if (authError.message.includes('Invalid login credentials')) {
                        throw new Error('Invalid credentials. Please check your ' + identifierType + ' and password.');
                    } else if (authError.message.includes('Email not confirmed')) {
                        throw new Error('Please verify your email address before signing in.');
                    } else if (authError.message.includes('Network request failed')) {
                        throw new Error('Network error. Please check your internet connection.');
                    } else {
                        throw new Error(authError.message || 'Sign in failed. Please try again.');
                    }
                }

                // Successful login
                if (authData?.user) {
                    // Optionally store remember me preference
                    const rememberMe = document.getElementById('rememberMe').checked;
                    if (rememberMe) {
                        localStorage.setItem('rememberedIdentifier', identifier);
                    } else {
                        localStorage.removeItem('rememberedIdentifier');
                    }
                    
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                }

            } catch (err) {
                console.error('Login error:', err);
                alertMsg.innerHTML = '<strong>' + err.message + '</strong>';
                alertMsg.style.display = 'block';
            } finally {
                resetSubmitButton();
            }
        });

        function resetSubmitButton() {
            submitBtn.disabled = false;
            btnText.textContent = 'Sign In';
            btnSpinner.classList.add('d-none');
            // Reset hCaptcha
            if (window.hcaptcha) {
                window.hcaptcha.reset();
            }
            hcaptchaToken.value = '';
        }

        // hCaptcha callback
        function onHcaptchaSuccess(token) {
            hcaptchaToken.value = token;
        }

        // Initialize hCaptcha
        (function initHcaptcha() {
            const widget = document.getElementById('hcaptcha-widget');
            if (widget && window.PUBLIC_CONFIG?.hcaptchaSitekey) {
                widget.setAttribute('data-sitekey', window.PUBLIC_CONFIG.hcaptchaSitekey);
                widget.setAttribute('data-callback', 'onHcaptchaSuccess');
            }
        })();

        // OAuth
        async function signInWithGoogle() {
            try {
                if (!supabase) {
                    throw new Error('Authentication service not initialized');
                }
                await supabase.auth.signInWithOAuth({ provider: 'google' });
            } catch (err) {
                console.error('Google sign-in error:', err);
                alertMsg.innerHTML = '<strong>Error:</strong> Unable to initiate Google sign-in. Please try again.';
                alertMsg.style.display = 'block';
            }
        }

        // Restore remembered identifier on page load
        (function restoreRememberedIdentifier() {
            const remembered = localStorage.getItem('rememberedIdentifier');
            if (remembered) {
                identifierInput.value = remembered;
                document.getElementById('rememberMe').checked = true;
            }
        })();
    </script>
</body>
