<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Calculator - SmartInvestsi</title>
    <meta name="description" content="Use our investment calculator to plan your financial future.">
    <meta name="google-adsense-account" content="ca-pub-8251495052020406">
    <meta name="robots" content="index,follow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/wwwroot/css/corporate-theme.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <h1 class="display-5 text-center mb-4">Investment Calculator</h1>
                
                <div class="card p-4">
                    <form id="calcForm">
                        <div class="mb-3">
                            <label class="form-label">Initial Investment ($)</label>
                            <input type="number" class="form-control" id="initial" value="1000" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Monthly Contribution ($)</label>
                            <input type="number" class="form-control" id="monthly" value="100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Annual Return (%)</label>
                            <input type="number" class="form-control" id="return" value="7" step="0.1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Years</label>
                            <input type="number" class="form-control" id="years" value="10" required>
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="calculate()">Calculate</button>
                    </form>
                    
                    <div id="result" class="mt-4" style="display:none;">
                        <h5>Your Projected Result</h5>
                        <p class="h3 text-success" id="finalAmount">$0</p>
                        <p class="text-muted" id="breakdown"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function calculate() {
            const initial = parseFloat(document.getElementById('initial').value);
            const monthly = parseFloat(document.getElementById('monthly').value);
            const annualReturn = parseFloat(document.getElementById('return').value) / 100;
            const years = parseInt(document.getElementById('years').value);
            
            const monthlyRate = annualReturn / 12;
            const months = years * 12;
            
            let amount = initial * Math.pow(1 + annualReturn, years);
            let contributionFV = monthly * (Math.pow(1 + monthlyRate, months) - 1) / monthlyRate;
            let total = amount + contributionFV;
            
            document.getElementById('finalAmount').textContent = '$' + total.toFixed(2);
            document.getElementById('breakdown').textContent = 'Initial: $' + initial.toFixed(2) + ' + Contributions: $' + (monthly * months).toFixed(2) + ' = ' + total.toFixed(2);
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
